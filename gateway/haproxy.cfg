global
    maxconn 128
    log stdout format raw local0 warning
    hard-stop-after 5s
defaults
    mode tcp
    timeout connect 3s
    timeout client 5m
    timeout server 5m
    timeout tunnel 10m
frontend ssh
    # Only listen on the ingress-side interface, never the honeypot-side interface.
    bind 172.30.78.2:2222
    default_backend cowrie
backend cowrie
    server cowrie 172.30.77.2:2222 send-proxy
