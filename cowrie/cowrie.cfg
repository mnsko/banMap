# Verified against Cowrie v3.1.4 (see docs/cowrie.md).
[honeypot]
hostname = debian-node
backend = shell
auth_class = UserDB
ttylog = false
download_limit_size = 1048576
idle_timeout = 120
authentication_timeout = 60
interactive_timeout = 600
logtype = rotating
timezone = UTC
[ssh]
enabled = true
listen_endpoints = haproxy:tcp:2222:interface=0.0.0.0
version = SSH-2.0-OpenSSH_9.2p1 Debian-2+deb12u5
sftp_enabled = false
forward_redirect = false
forward_tunnel = false
[telnet]
enabled = false
[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
